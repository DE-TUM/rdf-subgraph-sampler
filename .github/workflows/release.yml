name: Wheels and binaries

# Builds the Python wheels and the command-line binaries. On a tag v* they are
# attached to the GitHub release of that tag; on other runs they are kept as
# artifacts of the run.
on:
  push:
    tags: ["v*"]
    branches: [main, cpp-engine]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  cli-linux:
    name: Binary (Linux x86_64)
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release \
            -DBGPGEN_NATIVE=OFF -DBGPGEN_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j 4 --target bgpgen
          strip build/bgpgen
          cp build/bgpgen bgpgen-linux-x86_64
      - name: Run on the example graph, plain and gzipped
        run: |
          ./bgpgen-linux-x86_64 --data examples/toy.nt --shape path --size 2 --num 5
          gzip -k examples/toy.nt
          ./bgpgen-linux-x86_64 --data examples/toy.nt.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bgpgen-linux-x86_64
          path: bgpgen-linux-x86_64

  cli-macos:
    name: Binary (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release \
            -DBGPGEN_NATIVE=OFF -DBGPGEN_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j 4 --target bgpgen
          strip build/bgpgen
          cp build/bgpgen bgpgen-macos-arm64
      - name: Run on the example graph, plain and gzipped
        run: |
          ./bgpgen-macos-arm64 --data examples/toy.nt --shape path --size 2 --num 5
          gzip -k examples/toy.nt
          ./bgpgen-macos-arm64 --data examples/toy.nt.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bgpgen-macos-arm64
          path: bgpgen-macos-arm64

  release:
    name: Attach to the release
    needs: [wheels, cli-linux, cli-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
